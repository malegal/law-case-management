<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام إدارة القضايا القانوني</title>
    <meta name="theme-color" content="#000000">
    <meta name="description" content="نظام إدارة القضايا والمحاكمات القانونية">
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json">
    
    <!-- Icons -->
    <link rel="icon" type="image/png" href="assets/icon-192.png">
    <link rel="apple-touch-icon" href="assets/icon-192.png">
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">
    
    <!-- PWA Script -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(registration => {
                        console.log('ServiceWorker registered');
                    }).catch(err => {
                        console.log('ServiceWorker registration failed: ', err);
                    });
            });
        }
    </script>
</head>
<body>
    <!-- Login Screen -->
    <div id="loginScreen" class="login-screen">
        <div class="login-container glass-effect">
            <div class="logo">
                <div class="logo-icon">⚖️</div>
                <h1 class="gold-text">نظام إدارة القضايا</h1>
            </div>
            <div class="login-form">
                <input type="password" id="passwordInput" placeholder="أدخل كلمة المرور" class="glass-input">
                <button onclick="checkPassword()" class="gold-btn">دخول</button>
                <div id="loginError" class="error-message"></div>
            </div>
            <div class="login-footer">
                <p class="gray-text">كلمة المرور: Lawyer@301884</p>
            </div>
        </div>
    </div>

    <!-- Main App (Hidden until login) -->
    <div id="app" class="app-container" style="display: none;">
        <!-- Header -->
        <header class="app-header">
            <div class="header-content">
                <div class="logo-section">
                    <div class="logo">
                        <span class="logo-icon">⚖️</span>
                        <h1 class="gold-text">نظام إدارة القضايا</h1>
                    </div>
                    <div class="date-time">
                        <span id="currentDate" class="gold-text"></span>
                        <span id="currentTime" class="gold-text"></span>
                    </div>
                </div>
                <div class="user-section">
                    <span class="user-name">المحامي/محمود</span>
                    <button onclick="logout()" class="logout-btn gold-btn">تسجيل خروج</button>
                </div>
            </div>
        </header>

        <!-- Tabs Navigation -->
        <nav class="tabs-nav">
            <button class="tab-btn active" onclick="showTab('casesTab')">
                <span>📋</span> إدارة القضايا
            </button>
            <button class="tab-btn" onclick="showTab('sessionsTab')">
                <span>📅</span> إدارة الجلسات
            </button>
            <button class="tab-btn" onclick="showTab('reportsTab')">
                <span>🔍</span> البحث والتقارير
            </button>
        </nav>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Tab 1: Cases Management -->
            <div id="casesTab" class="tab-content active">
                <!-- Cases Tab Content will be loaded here -->
            </div>

            <!-- Tab 2: Sessions Management -->
            <div id="sessionsTab" class="tab-content">
                <!-- Sessions Tab Content will be loaded here -->
            </div>

            <!-- Tab 3: Reports -->
            <div id="reportsTab" class="tab-content">
                <!-- Reports Tab Content will be loaded here -->
            </div>
        </main>

        <!-- Footer -->
        <footer class="app-footer">
            <p class="gold-text">© 2024 نظام إدارة القضايا القانوني - النسخة 1.0</p>
            <div class="footer-links">
                <button onclick="exportData()" class="footer-link gold-text">تصدير البيانات</button>
                <button onclick="printReport()" class="footer-link gold-text">طباعة تقرير</button>
                <button onclick="clearCache()" class="footer-link gold-text">مسح البيانات</button>
            </div>
        </footer>
    </div>

    <!-- Notification -->
    <div id="notification" class="notification"></div>

    <!-- Scripts -->
    <script src="js/config.js"></script>
    <script src="js/database.js"></script>
    <script src="js/cases.js"></script>
    <script src="js/sessions.js"></script>
    <script src="js/reports.js"></script>
    <script src="js/main.js"></script>
    
    <!-- External Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.29.4/moment-with-locales.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment-timezone/0.5.40/moment-timezone-with-data.min.js"></script>
</body>
</html>
